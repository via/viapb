name: checks
on:
  - push
  - workflow_dispatch
  - pull_request
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: install python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: run validator
        run: (cd tests; make validate)

      - name: make example
        run: (cd example; make test && ./test)
