syntax = "proto3";

enum RegularEnum {
  Zero = 0;
  One = 1;
}

enum LargerEnum {
  LarZero = 0;
  TwoFiveSix = 256;
  SixteenThousand = 16000;
}

enum Negative {
  NegZero = 0;
  Minus14 = -14;
}

message ParentMessage {
  message NestedMessage {
    repeated int32 nested_int = 1;
  }

  enum NestedEnum {
    Def = 0;
    More = 2;
  }

  int32 some_int = 1;
  NestedMessage many_ints = 2;
  NestedEnum e_val = 3;
}

message AllTypes {
  int32 one_int32 = 1;
  uint32 one_uint32 = 2;
  sint32 one_sint32 = 3;

  int64 one_int64 = 4;
  uint64 one_uint64 = 5;
  sint64 one_sint64 = 6;

  fixed32 one_fixed32 = 7;
  fixed64 one_fixed64 = 8;

  bool one_bool = 9;

  string one_str = 10;
  bytes one_bytes = 11;

  float one_float = 12;
  double one_double = 13;

  sfixed32 one_sfixed32 = 14;
  sfixed64 one_sfixed64 = 15;


  repeated int32 many_int32 = 16;
  repeated uint32 many_uint32 = 17;
  repeated sint32 many_sint32 = 18;

  repeated int64 many_int64 = 19;
  repeated uint64 many_uint64 = 20;
  repeated sint64 many_sint64 = 21;

  repeated fixed32 many_fixed32 = 22;
  repeated fixed64 many_fixed64 = 23;

  repeated bool many_bool = 24;

  repeated string many_str = 25;
  repeated bytes many_bytes = 26;

  repeated float many_float = 27;
  repeated double many_double = 28;

  repeated sfixed32 many_sfixed32 = 29;
  repeated sfixed64 many_sfixed64 = 30;

  oneof selector {
    int32 selected_int32 = 31;
    uint32 selected_uint32 = 32;
    sint32 selected_sint32 = 33;

    int64 selected_int64 = 34;
    uint64 selected_uint64 = 35;
    sint64 selected_sint64 = 36;

    fixed32 selected_fixed32 = 37;
    fixed64 selected_fixed64 = 38;

    bool selected_bool = 39;

    string selected_str = 40;
    bytes selected_bytes = 41;

    float selected_float = 42;
    double selected_double = 43;

    sfixed32 selected_sfixed32 = 44;
    sfixed64 selected_sfixed64 = 45;
  }
}

